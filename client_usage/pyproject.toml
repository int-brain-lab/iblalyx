[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "alyx-client-usage"
version = "0.1.0"
description = "Record which client software, and versions of it, each Alyx account uses"
requires-python = ">=3.10"
dependencies = ["django>=5.2"]

[tool.setuptools.packages.find]
include = ["client_usage*"]
